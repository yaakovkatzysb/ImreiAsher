# OCR Pipeline Configuration
# ==========================

# Google Cloud Vision
google_vision:
  credentials_path: "credentials/vision-key.json"  # path to service account JSON file
  max_retries: 3
  timeout: 60  # seconds per request

# Input/Output paths
paths:
  input_dir: "data/input"
  output_txt_dir: "data/output/txt"
  output_json_dir: "data/output/json"
  output_reports_dir: "data/output/reports"
  database_path: "data/output/database.db"
  dictionary_path: "data/dictionaries/hebrew_words.txt"
  cache_dir: "data/cache"

# Processing
processing:
  parallel_workers: 3
  dpi: 300  # resolution for PDF to image conversion
  confidence_threshold: 0.80  # below this, apply pre-processing

# Quality thresholds
quality:
  hebrew_ratio_min: 0.85
  weird_chars_max: 10
  chars_per_page_min: 500
  chars_per_page_max: 5000

# Pre-processing (for poor quality files)
preprocessing:
  denoise: true
  binarize: true
  deskew: true
  enhance_contrast: true  # CLAHE
  upscale_factor: 2  # for low resolution images

# Quality assessment thresholds (for adaptive pipeline)
quality_assessment:
  good_threshold: 0.90   # above = good quality, skip pre-processing
  medium_threshold: 0.75  # above = medium, light pre-processing
  # below medium = poor quality, full pre-processing

# Post-processing (text cleanup after OCR)
post_processing:
  # Interstitial phrases to remove (continuation markers between pages)
  interstitial_phrases:
    - "המשך בעמוד הבא"
    - "המשך בעמוד"
    - "המשך פנינים יקרים"
    - "המשך בעמ'"

  # Known repeating headers (removed from every page)
  # Auto-detection also finds headers that repeat across most pages
  repeating_headers: []

  # How many top lines to scan for repeating header detection
  header_scan_lines: 3

  # Minimum ratio of pages a line must appear on to be considered a header
  header_min_page_ratio: 0.5

  # Document header template (inserted at beginning of output)
  # {issue_number} and {issue_date} are replaced from filename
  header_template: |
    ══════════════════════════════
               החברותא
         גליון מס' {issue_number}
         {issue_date}
    ══════════════════════════════
